name: V0374 Temporary Android Build Kit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v0374-temp-buildkit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Gradle and dependency cache
        shell: bash
        run: |
          set -euo pipefail
          curl -L --retry 4 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          mkdir -p /tmp/prefetch
          cat > /tmp/prefetch/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'prefetch'
          EOF
          cat > /tmp/prefetch/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.daemon=false
          EOF
          cat > /tmp/prefetch/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.0'
          }
          android {
              namespace 'com.aizheyu.prefetch'
              compileSdk 36
          }
          dependencies {
              implementation 'androidx.credentials:credentials:1.6.0'
              implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
              implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'
          }
          EOF
          cd /tmp/prefetch
          /tmp/gradle-8.13/bin/gradle --no-daemon dependencies
          /tmp/gradle-8.13/bin/gradle --no-daemon tasks

      - name: Extract Godot Android source template
        shell: bash
        run: |
          set -euo pipefail
          curl -L --retry 4 -o /tmp/godot_templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p kit/godot
          unzip -p /tmp/godot_templates.tpz templates/android_source.zip > kit/godot/android_source.zip
          test -s kit/godot/android_source.zip
          unzip -t kit/godot/android_source.zip >/dev/null

      - name: Package offline kit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kit/android-sdk/platforms kit/android-sdk/build-tools kit/android-sdk/platform-tools kit/gradle
          cp -a "$ANDROID_HOME/platforms/android-36" kit/android-sdk/platforms/
          cp -a "$ANDROID_HOME/build-tools/36.0.0" kit/android-sdk/build-tools/
          cp -a "$ANDROID_HOME/platform-tools/." kit/android-sdk/platform-tools/
          cp -a /tmp/gradle-8.13 kit/gradle/
          mkdir -p kit/gradle-home/caches
          cp -a "$HOME/.gradle/caches/modules-2" kit/gradle-home/caches/
          cp -a "$HOME/.gradle/caches/jars-"* kit/gradle-home/caches/ 2>/dev/null || true
          cp -a "$HOME/.gradle/caches/transforms-"* kit/gradle-home/caches/ 2>/dev/null || true
          printf '%s\n'             'Godot=4.7.1.stable'             'AndroidPlatform=36'             'BuildTools=36.0.0'             'Gradle=8.13'             'AGP=8.13.0'             'credentials=1.6.0'             'credentials-play-services-auth=1.6.0'             'googleid=1.2.0' > kit/BUILD_INFO.txt
          find kit -type f -print0 | sort -z | xargs -0 sha256sum > kit/SHA256SUMS.txt
          tar --zstd -cf v0374-offline-android-kit.tar.zst kit
          sha256sum v0374-offline-android-kit.tar.zst
          ls -lh v0374-offline-android-kit.tar.zst

      - name: Publish temporary public release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v0374-buildkit-temp --cleanup-tag -y 2>/dev/null || true
          gh release create v0374-buildkit-temp             v0374-offline-android-kit.tar.zst             --title "Temporary v0.3.74 Android build kit"             --notes "Temporary public build-tool archive containing only public Android/Godot/Gradle tooling; no game source or credentials."             --prerelease
          gh release view v0374-buildkit-temp --json url,assets
