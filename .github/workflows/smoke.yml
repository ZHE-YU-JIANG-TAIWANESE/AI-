name: OCW smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src
      - name: CLI
        run: ocw --help
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Prepublish guard
        run: python scripts/prepublish_guard.py .
